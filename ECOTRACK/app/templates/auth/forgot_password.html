{% extends 'base.html' %}
{% block title %}Forgot Password - EcoTrack{% endblock %}
{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-key fs-1 text-success"></i>
                        <h3 class="fw-bold mt-2">Reset Password</h3>
                        <p class="text-muted">Enter your email and we'll send you a link to reset your password.</p>
                    </div>
                    
                    <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="needs-validation" novalidate>
                        <div class="mb-4">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" class="form-control form-control-lg" id="email" name="email" required placeholder="name@example.com">
                            <div class="invalid-feedback">Please enter a valid email address.</div>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg rounded-pill">Send Reset Link</button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="text-muted mb-0"><a href="{{ url_for('auth.login') }}" class="text-success text-decoration-none fw-medium"><i class="bi bi-arrow-left me-1"></i>Back to Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Bootstrap form validation
    (function () {
        'use strict'
        var forms = document.querySelectorAll('.needs-validation')
        Array.prototype.slice.call(forms).forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>
{% endblock %}
